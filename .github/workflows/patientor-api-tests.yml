name: Patientor API Tests

on:
  # push:
  #   branches: [ main, master ]
  #   paths: [ 'part9/fs-typescript/**' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install patientor backend dependencies
      working-directory: ./part9/fs-typescript/patientor/backend
      run: npm install --legacy-peer-deps

    - name: Lint patientor backend
      working-directory: ./part9/fs-typescript/patientor/backend
      run: npm run lint

    - name: Install test dependencies
      working-directory: ./part9/fs-typescript/patientor-api-tests
      run: npm install

    # The backend is started by Playwright's `webServer` config, which waits
    # for /api/ping to respond and shuts the server down afterwards.
    - name: Run API tests
      working-directory: ./part9/fs-typescript/patientor-api-tests
      run: npm test

    - name: Upload test report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: playwright-report
        path: part9/fs-typescript/patientor-api-tests/playwright-report/
        retention-days: 30
