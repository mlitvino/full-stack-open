name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  #workflow_dispatch:

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part11
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install dependencies
      run: npm install
    - name: Check style
      run: npm run eslint
    - name: Unit tests
      run: npm run test
    - name: Build
      run: npm run build
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: e2e test
      run: npm run test:e2e
    - name: Build failure notification
      if: ${{ failure() }}
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: Failure
        title: Build failed
        description: |
          Commit `${{ github.sha }}` by ${{ github.actor }} broke the build! Fix it!
        color: 0xff0000
  tag_release:
    needs: [simple_deployment_pipeline]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Bump version and push tag
      id: tag_version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch
    - name: Deployment success notification
      if: ${{ success() }}
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: Success
        title: A new version has been deployed
        description: |
          Version `${{ steps.tag_version.outputs.new_tag }}` by ${{ github.actor }}
        color: 0x00ff00
