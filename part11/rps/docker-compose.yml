services:

  frontend:
    build: ./frontend
    env_file:
      - ./.env
    networks:
      - network

  backend:
    restart: unless-stopped
    build: ./backend
    env_file:
      - ./.env
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://backend:3000/api/health || exit 1"]
      interval: 15s
      timeout: 2s
      start_period: 120s
      retries: 1

  db:
    restart: unless-stopped
    image: postgres:17-alpine
    env_file:
      - ./.env
    networks:
      network:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 2s
      start_period: 120s
      retries: 1

  nginx:
    restart: unless-stopped
    build: ./nginx
    env_file:
      - ./.env
    depends_on:
      - frontend
      - backend
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null ${FRONTEND_URL} || exit 1"]
      interval: 15s
      timeout: 2s
      start_period: 120s
      retries: 1

  healthchecker:
    image: alpine:3.23.3
    depends_on:
      nginx:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - network


networks:
  network:
